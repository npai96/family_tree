services:
  app:
    image: "${APP_IMAGE}"
    environment:
      APP_ENV: "${APP_ENV:-production}"
      ENABLE_REVIEW_AUTH: "${ENABLE_REVIEW_AUTH:-false}"
      ALLOW_LEGACY_X_USER_ID: "${ALLOW_LEGACY_X_USER_ID:-false}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      ENABLE_METRICS_ENDPOINT: "${ENABLE_METRICS_ENDPOINT:-false}"
      METRICS_BEARER_TOKEN: "${METRICS_BEARER_TOKEN:-}"
      DB_PATH: "${DB_PATH:-/data/mvp.db}"
      DATABASE_URL: "${DATABASE_URL:-}"
      POSTGRES_RUNTIME_ENABLED: "${POSTGRES_RUNTIME_ENABLED:-false}"
      MEDIA_DIR: /app/app/media
    volumes:
      - "${DATA_DIR}:/data"
      - "${MEDIA_DIR}:/app/app/media"
    expose:
      - "8000"
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      - app
    environment:
      DOMAIN: "${DOMAIN}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
